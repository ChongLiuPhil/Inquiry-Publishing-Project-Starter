name: Unified public site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; resolved in run 35684632168
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7; resolved in run 35684632168
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; resolved in run 35684632168
        with:
          node-version: '22.22.0'
      - run: python -m pip install -r requirements-validation.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:github-app
      - run: python tools/check_workers_contract.py
      - run: python -m unittest discover -s tests -p 'test_*site*.py' -v
      - name: Verify real static and Quarto publication examples
        run: |
          quarto_bin="$(bash tools/ensure_quarto.sh)"
          export PATH="$(dirname "$quarto_bin"):$PATH"
          python tools/test_publication_examples.py
      - run: python tools/build_public_site.py
      - run: npm run cloudflare:deploy -- --dry-run
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/test_public_site_browser.py
      - name: Verify holding-page bootstrap contains no project content
        run: |
          mv _site _site-candidate
          python tools/build_public_site.py --holding
          test "$(find _site -type f | wc -l)" -eq 3
          test ! -e _site/agent/entry.json
          rm -r _site
          mv _site-candidate _site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; resolved in run 35684632168
        if: always()
        with:
          name: unified-public-site-candidate
          path: |
            _site/
            artifacts/public-site/
          retention-days: 14
# Build and validation only. No provider credentials and no deployment step.
