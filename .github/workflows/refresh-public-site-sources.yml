name: Refresh unified public site sources

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Source repository (empty: manual recovery of all sources)'
        type: string
      branch:
        description: 'Source publication branch'
        type: string
      revision:
        description: 'Full source commit SHA'
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: unified-public-site-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Test the source update gates
        run: python -m unittest discover -s tests -p 'test_*site*.py' -v
      - name: Check registered publication outputs
        id: refresh
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: python tools/refresh_public_site_sources.py --apply
      - name: Rebuild and validate the composed site
        if: steps.refresh.outputs.changed == 'true'
        run: |
          python tools/build_public_site.py
          python tools/validate_public_site.py
      - name: Publish through protected source-update PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_source_lock.py
