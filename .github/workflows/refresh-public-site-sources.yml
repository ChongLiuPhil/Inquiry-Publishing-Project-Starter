name: Refresh unified public site sources

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unified-public-site-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.12'
      - name: Check public allowlisted upstream files
        id: refresh
        run: python tools/refresh_public_site_sources.py --apply
      - name: Rebuild and validate the composed site
        if: steps.refresh.outputs.changed == 'true'
        run: |
          python tools/build_public_site.py
          python tools/validate_public_site.py
      - name: Commit the verified source lock
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/sources.lock.json
          git commit -m "Refresh public-site source revisions"
          git push origin HEAD:main
