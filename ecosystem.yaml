schema_version: "1.1"
ecosystem:
  id: inquiry-publishing-stack
  name: Inquiry Publishing Stack
  canonical_entrypoint:
    homepage: https://inquirystack.philohub.workers.dev/starter/
    repository: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter
  human_entrypoint:
    role: human-conceptual-entry
    current_public_landing: https://inquirystack.philohub.workers.dev/
    delivery_provider: cloudflare-workers
    provider_may_change: true
    canonical_content_source_zh_cn: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.zh-CN.md
    canonical_content_source_en: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.md
    homepage: https://inquirystack.philohub.workers.dev/
    guide_zh_cn: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.zh-CN.md
    guide_en: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/docs/HUMAN_GUIDE.md
  machine_entrypoint:
    role: composition-and-configuration-entry
    public_landing: https://inquirystack.philohub.workers.dev/agent/
    descriptor: https://inquirystack.philohub.workers.dev/agent/entry.json
    bootstrap_en: https://inquirystack.philohub.workers.dev/agent/bootstrap.txt
    bootstrap_zh_cn: https://inquirystack.philohub.workers.dev/agent/bootstrap.zh-CN.txt
    ecosystem: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/ecosystem.yaml
    agent_retrieval_contract: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/docs/AGENT_RETRIEVAL_CONTRACT.md
  agent_entrypoint: docs/ECOSYSTEM.md
  agent_retrieval_contract: docs/AGENT_RETRIEVAL_CONTRACT.md
  llms_entrypoint: https://inquirystack.philohub.workers.dev/llms.txt
  language_policy: human-readable pages are single-language with a Chinese/English switch
  public_delivery:
    canonical_source_provider: github
    current_provider: cloudflare-workers
    preferred_provider: cloudflare-workers
    migration_state: verified-cutover
    migration_plan: templates/cloudflare-public-delivery.yaml
    migration_guide: docs/CLOUDFLARE_PUBLIC_DELIVERY_MIGRATION.md
    stable_url_policy: free-provider-native-allowed-after-explicit-cutover
    cutover_rule: workers-dev-canonical-after-verified-human-approved-cutover
    target_topology: single-site-multi-repository
    target_active_worker_count: 1
    source_lock: site/sources.lock.json
  baseline:
    default_profile: full-research-publication
    ahicp: full
    ppf: full
    vault_interface: compatible-public-interface
    continuous_web: required-for-published-projects
    source_visibility: private-by-default-for-original-work
    web_visibility: restricted-by-default-for-unpublished-work
    cloudflare_access: required-for-private-or-transitional-publications
    infrastructure_profile: workers-builds-native
    platform_authorization: optional-for-advanced-external-ci
    secret_broker: optional-advanced-external-ci-only
    live_new_project_acceptance: per-project-verification-required
    deviations: require-explicit-human-selection
  components:
    ahicp:
      repository: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol
      homepage: https://inquirystack.philohub.workers.dev/ahicp/
      ecosystem: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol/blob/main/ecosystem.yaml
      role: human-led AI-assisted inquiry and creation governance
    ppf:
      repository: https://github.com/ChongLiuPhil/Personal-Publishing-Framework
      homepage: https://inquirystack.philohub.workers.dev/ppf/
      ecosystem: https://github.com/ChongLiuPhil/Personal-Publishing-Framework/blob/main/ecosystem.yaml
      role: source-centered publishing lifecycle and continuous web
    vault_interface:
      repository: https://github.com/ChongLiuPhil/Vault-interface
      homepage: https://inquirystack.philohub.workers.dev/vault-interface/
      ecosystem: https://github.com/ChongLiuPhil/Vault-interface/blob/main/ecosystem.yaml
      role: provider-neutral public metadata contract
    starter:
      repository: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter
      homepage: https://inquirystack.philohub.workers.dev/starter/
      ecosystem: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter/blob/main/ecosystem.yaml
      role: composition, adoption, project-provisioning orchestration, and upgrade layer
  project_provisioning:
    status: guided-per-project-default
    default_github_owner: ChongLiuPhil
    default_github_owner_type: user
    default_repository_visibility: private
    preferred_infrastructure_profile: workers-builds-native
    default_setup_mode: human-assisted-once-per-project
    default_access_mode: worker-scoped-access
    contract_en: docs/PROJECT_PROVISIONING_CONTRACT.md
    contract_zh_cn: docs/PROJECT_PROVISIONING_CONTRACT.zh-CN.md
    acceptance_en: docs/PROJECT_PROVISIONING_ACCEPTANCE.md
    acceptance_zh_cn: docs/PROJECT_PROVISIONING_ACCEPTANCE.zh-CN.md
    request_schema: schema/project-provisioning-request.schema.json
    request_template: templates/project-provisioning-request.yaml
    bootstrap_state_schema: schema/project-bootstrap-state.schema.json
    bootstrap_state_template: templates/project-bootstrap-state.yaml
    durable_bootstrap_state: project-bootstrap-state.yaml
    memory_writeback_contract_en: docs/PROJECT_MEMORY_WRITEBACK.md
    memory_writeback_contract_zh_cn: docs/PROJECT_MEMORY_WRITEBACK.zh-CN.md
    repository_memory_is_authoritative: true
    chat_memory_is_authoritative: false
    platform_authorization_schema: schema/platform-authorization.schema.json
    platform_authorization_template: templates/platform-authorization.yaml
    platform_authorization_role: optional-advanced-profile-state
    executable_provider_authority: https://github.com/ChongLiuPhil/Personal-Publishing-Framework
    executable_provider_contract: https://github.com/ChongLiuPhil/Personal-Publishing-Framework/blob/main/docs/PER_PROJECT_GITHUB_CLOUDFLARE_SETUP.md
    advanced_external_ci_contract: https://github.com/ChongLiuPhil/Personal-Publishing-Framework/blob/main/docs/AGENT_PROVISIONED_EXTERNAL_CI.md
    trusted_secret_broker_contract: https://github.com/ChongLiuPhil/Personal-Publishing-Framework/blob/main/docs/TRUSTED_SECRET_BROKER.md
    secret_broker_orchestration: optional-advanced-ppf-implemented
    cloudflare_granular_token_issuer: optional-advanced-live-acceptance-pending
    ordinary_project_human_bootstrap:
      - create-or-confirm-private-personal-repository
      - reuse-existing-cloudflare-git-account-connection-if-available
      - authorize-cloudflare-github-app-repository-access-if-needed
      - connect-workers-builds
      - ensure-worker-application-name-matches-wrangler-jsonc-name
      - enable-cloudflare-zero-trust-once-if-needed
      - protect-target-worker-with-access
      - verify-first-restricted-deployment
      - verify-second-push-auto-deploy-without-reauthorization
    human_reserved:
      - public-release
      - source-repository-public
      - reader-audience-expansion
      - custom-domain-or-dns-authority
      - provider-permission-scope-expansion
      - paid-plan-or-billing-change
      - direct-secret-input-if-trusted-broker-unavailable
    secret_rule: provider-credentials-never-enter-model-context

  privacy:
    original_unpublished_content: private-by-default
    private_control_plane: never copied into public repositories
    public_repositories: methods, schemas, templates, validators, and approved public documentation only
    secrets: never stored in repositories or chat
  publication_defaults:
    continuous_web: enabled-when-project-is-published
    unpublished_web_visibility: restricted
    reader_access:
      mode: authenticated
      implementation: cloudflare-access
      policy_ref: shared-reader-access
      secret_material: provider-side-only
    public_cutover: explicit-human-authorization-required
  retrieval:
    reconstruct_ecosystem_from_any_public_entrypoint: true
    follow_agent_entrypoint: true
    follow_component_links: true
    fresh_read_pinned_manifests_before_configuration: true
    fetch_private_state: only-after-explicit-human-authorization
    public_links_do_not_grant_private_access: true
  cloudflare:
    new_project_default_profile: workers-builds-native
    native_profile: workers-builds-native
    advanced_profile: agent-provisioned-external-ci
    default_project_access: worker-scoped-access
    per_project_setup_guide: https://github.com/ChongLiuPhil/Personal-Publishing-Framework/blob/main/docs/PER_PROJECT_GITHUB_CLOUDFLARE_SETUP.md
    public_delivery_migration: docs/CLOUDFLARE_PUBLIC_DELIVERY_MIGRATION.md
    public_delivery_plan: templates/cloudflare-public-delivery.yaml
    operational_guide: docs/CONTINUOUS_WEB_CLOUDFLARE.md
    agent_must_give_numbered_human_steps_when_required: true
    agent_must_state_verification_and_rollback: true
