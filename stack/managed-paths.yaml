schema: starter-ownership/v2
composition_managed:
  - project-stack.yaml
  - project-stack.lock.yaml
  - project-provisioning.yaml
project_merge_managed:
  - project.yaml
  - website.yaml
  - publishing.yaml
upstream_ownership:
  authority: pinned-component-manifests
  rule: >-
    Never copy AHICP or PPF ownership lists into this file. Before adoption or upgrade,
    read each active component manifest at its pinned template_source_commit and use
    that manifest's upstream-managed, merge-managed, and project-owned classifications.
rule: Project-owned paths declared by any active upstream component MUST NOT be overwritten automatically.
