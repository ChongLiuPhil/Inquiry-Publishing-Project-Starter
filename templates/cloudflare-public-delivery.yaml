schema: starter/cloudflare-public-delivery/v3
status: workers-full-site-verified-candidate-not-cutover
preferred_public_delivery_provider: cloudflare-workers
canonical_source_provider: github
current_public_delivery_provider: github-pages
cutover_state: not-started
cutover_rule: switch-public-entrypoints-only-after-verified-cloudflare-deployment
architecture:
  topology: single-site-multi-repository
  independent_normative_components:
  - ahicp
  - ppf
  - vault_interface
  - starter
  composition_repository: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter
  source_lock: site/sources.lock.json
  decision: docs/UNIFIED_PUBLIC_SITE.md
  human_approved_on: '2026-09-22'
  public_cutover_authorized: false
  expected_active_worker_count: 1
stable_url_policy:
  custom_domain_preferred: false
  workers_dev_allowed: true
  selected_custom_domain: null
  provider_native_permanent_identity_allowed_after_explicit_cutover: true
  custom_domain_optional: true
site:
  custom_domain: null
  provider_state_verified: true
  cloudflare_builds_repository_scope:
  - ChongLiuPhil/Inquiry-Publishing-Project-Starter
  publishing_app_installed_repositories:
  - ChongLiuPhil/Inquiry-Publishing-Project-Starter
  - ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol
  - ChongLiuPhil/Personal-Publishing-Framework
  - ChongLiuPhil/Vault-interface
  other_upstreams: public-unauthenticated-pinned-file-reads
  worker_name: inquirystack
  provider_url: https://inquirystack.philohub.workers.dev
  verified_scope: full-public-candidate-and-git-triggered-main-build
  retained_pages_project: inquiry-publishing-stack
build_defaults:
  production_branch: main
  root_dir: .
  build_command: npm ci --ignore-scripts --no-audit --no-fund && python tools/build_public_site.py
  output_dir: _site
  framework_preset: none
  environment:
    PYTHON_VERSION: 3.12.12
    NODE_VERSION: 22.22.0
  build_contract: cloudflare-builds.yaml
bootstrap:
  initial_build_command: python tools/build_public_site.py --holding
  initial_output_contains: holding-page-only
  automatic_production_deployments: true
  automatic_preview_deployments: false
  before_full_candidate:
  - verify-user-authorized-main-public-reading
  - verify-current-worker-and-holding-rollback-version
  - verify-preview-urls-disabled-until-access-ready
  - verify-repository-build-and-source-lock
preview_defaults:
  enabled: false
  visibility: restricted
  authentication: cloudflare-access
  public_preview_allowed: false
  enable_after: verified-access-and-approved-preview-audience
staging_defaults:
  visibility: public
  anonymous_reading_authorized: true
  authorization_date: '2026-09-22'
  formal_url_cutover_authorized: false
  noindex_is_authentication: false
production_defaults:
  framework_sites_visibility: public-reading-authorized-canonical-cutover-separate
  source_repository_visibility: public
  deployment_provider: cloudflare-workers
  downstream_project_visibility: independent-private-restricted-defaults
current_entries:
  human: https://chongliuphil.github.io/AI-Assisted-Human-Inquiry-and-Creation-Protocol/
  machine: https://chongliuphil.github.io/Inquiry-Publishing-Project-Starter/agent/
target_routes:
  human: /
  start: /start/
  ahicp: /ahicp/
  ppf: /ppf/
  vault_interface: /vault-interface/
  starter: /starter/
  machine: /agent/
  descriptor: /agent/entry.json
  llms: /llms.txt
  provenance: /build-info.json
components:
  ahicp:
    repository: https://github.com/ChongLiuPhil/AI-Assisted-Human-Inquiry-and-Creation-Protocol
    current_url: https://chongliuphil.github.io/AI-Assisted-Human-Inquiry-and-Creation-Protocol/
    target_path: /ahicp/
    role: human-conceptual-content-authority
  ppf:
    repository: https://github.com/ChongLiuPhil/Personal-Publishing-Framework
    current_url: https://chongliuphil.github.io/Personal-Publishing-Framework/
    target_path: /ppf/
    role: publishing-lifecycle-authority
  vault_interface:
    repository: https://github.com/ChongLiuPhil/Vault-interface
    current_url: https://chongliuphil.github.io/Vault-interface/
    target_path: /vault-interface/
    role: public-metadata-authority
  starter:
    repository: https://github.com/ChongLiuPhil/Inquiry-Publishing-Project-Starter
    current_url: https://chongliuphil.github.io/Inquiry-Publishing-Project-Starter/
    target_path: /starter/
    role: composition-and-machine-entry-authority
